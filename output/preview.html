<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梅田リール プレビュー</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #111;
    color: #eee;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 24px 0 0; }
  .meta { font-size: 13px; color: #aaa; }
  .phone {
    width: 360px;
    max-width: 92vw;
    aspect-ratio: 9 / 16;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    background: #000;
  }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .hint { font-size: 12px; color: #888; margin-bottom: 24px; }
</style>
</head>
<body>
  <h1>① 第1木曜 興味喚起（入口）— 梅田リール</h1>
  <div class="meta">1080×1920 / 9:16 ・ 約64秒 ・ 30fps ・ 音声なし</div>
  <div class="phone">
    <video src="final.mp4" controls autoplay loop muted playsinline></video>
  </div>
  <div class="hint">タップで再生／一時停止・バーでスクラブできます</div>
</body>
</html>
